<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stockyllix market source</title><style>html,body{margin:0;height:100%;font:13px system-ui,sans-serif} .tradingview-widget-container{height:calc(100% - 4px);width:100%}.tradingview-widget-container__widget{height:calc(100% - 28px)}.tradingview-widget-copyright{padding:5px;text-align:center;font-size:11px}a{color:#5f8f80}#failure{padding:20px;display:none}</style></head>
<body><div id="failure" role="status">The source panel could not load. Try reloading or open TradingView directly.</div><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div><div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/" target="_blank" rel="noopener nofollow">Market data by TradingView</a></div></div>
<script>
  // only two fixed official widgets can be loaded; no data is extracted.
  const params = new URLSearchParams(location.search);
  const news = params.get('kind') === 'news';
  const colorTheme = params.get('theme') === 'dark' ? 'dark' : 'light';
  document.body.style.background = colorTheme === 'dark' ? '#15241e' : '#ffffff';
  document.body.style.color = colorTheme === 'dark' ? '#eaf1ec' : '#153c32';
  const ta = [['LUMI','Bank Leumi'],['POLI','Bank Hapoalim'],['MZTF','Mizrahi Tefahot'],['DSCT','Discount Bank'],['BEZQ','Bezeq'],['AZRG','Azrieli'],['ESLT','Elbit Systems'],['ICL','ICL'],['TEVA','Teva'],['NICE','NICE']];
  const us = [['NASDAQ:AAPL','Apple'],['NASDAQ:MSFT','Microsoft'],['NASDAQ:AMZN','Amazon'],['NASDAQ:GOOGL','Alphabet'],['NASDAQ:NVDA','NVIDIA'],['NASDAQ:META','Meta'],['NYSE:JPM','JPMorgan'],['NYSE:JNJ','Johnson & Johnson'],['NYSE:KO','Coca-Cola'],['AMEX:SPY','S&P 500 ETF']];
  const config = news ? {feedMode:'all_symbols',displayMode:'regular',colorTheme,locale:'en',width:'100%',height:'100%',isTransparent:false} : {title:'Current markets',width:'100%',height:'100%',locale:'en',colorTheme,showSymbolLogo:true,symbolsGroups:[{name:'Tel Aviv · ILA (agorot)',symbols:ta.map(([symbol,name])=>({name:`TASE:${symbol}`,displayName:name}))},{name:'United States · USD',symbols:us.map(([name,displayName])=>({name,displayName}))}]};
  const script = document.createElement('script');
  script.src = `https://s3.tradingview.com/external-embedding/embed-widget-${news ? 'timeline' : 'market-quotes'}.js`;
  script.async = true;
  script.textContent = JSON.stringify(config);
  script.onerror = () => { document.getElementById('failure').style.display = 'block'; };
  document.querySelector('.tradingview-widget-container').appendChild(script);
</script></body></html>
